<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Config Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-width: 320px;
            min-height: 200px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header h1 {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ec9b0;
        }
        
        .status-dot.error {
            background: #f44747;
        }
        
        .status-dot.warning {
            background: #cca700;
        }
        
        .content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
            min-height: 0;
        }
        
        .config-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .config-label {
            font-size: 11px;
            color: #9cdcfe;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .config-input {
            background: #3c3c3c;
            border: 1px solid #4c4c4c;
            border-radius: 4px;
            padding: 6px 10px;
            color: #d4d4d4;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        
        .config-input:focus {
            border-color: #007acc;
        }
        
        .config-input::placeholder {
            color: #6a6a6a;
        }
        
        .servers-list {
            flex: 1;
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 8px;
            overflow-y: auto;
            min-height: 0;
        }
        
        .server-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            transition: background 0.15s;
        }
        
        .server-item:hover {
            background: #3c3c3c;
        }
        
        .server-name {
            color: #4ec9b0;
            font-weight: 500;
        }
        
        .server-command {
            color: #9cdcfe;
            font-size: 11px;
            margin-left: 8px;
        }
        
        .server-count {
            color: #6a6a6a;
            font-size: 11px;
        }
        
        .empty-state {
            color: #6a6a6a;
            font-size: 12px;
            text-align: center;
            padding: 16px 8px;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            padding-top: 4px;
        }
        
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        
        .btn-primary {
            background: #0e639c;
            color: #ffffff;
        }
        
        .btn-primary:hover {
            background: #1177bb;
        }
        
        .btn-primary:active {
            background: #0d5a8a;
        }
        
        .btn-secondary {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #4c4c4c;
        }
        
        .btn-secondary:hover {
            background: #4c4c4c;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .footer {
            border-top: 1px solid #3c3c3c;
            padding: 6px 12px;
            font-size: 10px;
            color: #6a6a6a;
            text-align: center;
        }
        
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #3c3c3c;
            border-top-color: #0e639c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        
        .btn.loading .spinner {
            display: inline-block;
        }
        
        .btn.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 11px;
            color: #d4d4d4;
            opacity: 0;
            transition: all 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success {
            border-color: #4ec9b0;
        }
        
        .toast.error {
            border-color: #f44747;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MCP Config Sync</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Ready</span>
        </div>
    </div>
    
    <div class="content">
        <div class="config-section" style="flex: 1;">
            <label class="config-label">Discovered Configs</label>
            <div class="servers-list" id="configsList">
                <div class="empty-state">Click "Scan" to find configs or "Load Saved" to view cached</div>
            </div>
        </div>
        
        <div class="config-section" style="flex: 1; display: none;" id="toolsSection">
            <label class="config-label">MCP Tools / Servers</label>
            <div class="servers-list" id="toolsList">
                <div class="empty-state">Select a config to view tools</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-secondary" id="btnLoadSaved">
                <span class="spinner"></span>
                <span class="btn-text">Load Saved</span>
            </button>
            <button class="btn btn-secondary" id="btnScan">
                <span class="spinner"></span>
                <span class="btn-text">Scan</span>
            </button>
            <button class="btn btn-primary" id="btnSync">
                <span class="spinner"></span>
                <span class="btn-text">Sync</span>
            </button>
        </div>
    </div>
    
    <div class="footer">
        Syncs MCP servers across VS Code, Cursor, Copilot configs
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // State
        let discoveredConfigs = [];
        let selectedConfig = null;
        
        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const configsList = document.getElementById('configsList');
        const btnScan = document.getElementById('btnScan');
        const btnSync = document.getElementById('btnSync');
        const toast = document.getElementById('toast');
        
        // Initialize
        async function init() {
            updateStatus('ready', 'Ready');
        }
        
        function renderConfigs() {
            if (discoveredConfigs.length === 0) {
                configsList.innerHTML = '<div class="empty-state">No configs found. Click Scan to search.</div>';
                return;
            }
            
            configsList.innerHTML = discoveredConfigs.map((config, index) => `
                <div class="server-item ${selectedConfig === index ? 'selected' : ''}" data-index="${index}">
                    <div style="flex: 1; min-width: 0;">
                        <div class="server-name">${escapeHtml(config.relativePath)}</div>
                        <div class="server-command">${escapeHtml(config.type)}</div>
                        ${config.error ? `<div style="color: #f44747; font-size: 10px; margin-top: 2px;">${escapeHtml(config.error)}</div>` : ''}
                    </div>
                    ${config.exists && !config.error ? '<span style="color: #4ec9b0; font-size: 11px;">✓</span>' : ''}
                </div>
            `).join('');
            
            // Add click handlers
            configsList.querySelectorAll('.server-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    selectedConfig = selectedConfig === index ? null : index;
                    renderConfigs();
                });
            });
        }
        
        function updateStatus(type, text) {
            statusDot.className = 'status-dot';
            if (type === 'error') statusDot.classList.add('error');
            if (type === 'warning') statusDot.classList.add('warning');
            statusText.textContent = text;
        }
        
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function setLoading(btn, loading) {
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Event handlers
        btnLoadSaved.addEventListener('click', async () => {
            setLoading(btnLoadSaved, true);
            updateStatus('warning', 'Loading saved...');
            
            try {
                const response = await fetch('/api/configs');
                const configs = await response.json();
                
                discoveredConfigs = configs;
                selectedConfig = null;
                renderConfigs();
                
                const validCount = configs.filter(c => c.exists && !c.error).length;
                showToast(`Loaded ${validCount} config(s) from cache`, 'success');
                updateStatus('ready', `Loaded ${validCount}`);
            } catch (e) {
                showToast(e.message, 'error');
                updateStatus('error', 'Error');
            } finally {
                setLoading(btnLoadSaved, false);
            }
        });
        
        btnScan.addEventListener('click', async () => {
            setLoading(btnScan, true);
            updateStatus('warning', 'Scanning...');
            
            try {
                const response = await fetch('/api/scan');
                const configs = await response.json();
                
                discoveredConfigs = configs;
                selectedConfig = null;
                renderConfigs();
                
                const validCount = configs.filter(c => c.exists && !c.error).length;
                showToast(`Found ${validCount} valid config(s)`, 'success');
                updateStatus('ready', `Found ${validCount}`);
            } catch (e) {
                showToast(e.message, 'error');
                updateStatus('error', 'Error');
            } finally {
                setLoading(btnScan, false);
            }
        });
        
        btnSync.addEventListener('click', async () => {
            if (discoveredConfigs.length === 0) {
                showToast('No configs to sync', 'error');
                return;
            }
            
            setLoading(btnSync, true);
            updateStatus('warning', 'Syncing...');
            
            try {
                const response = await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dryRun: false })
                });
                
                const result = await response.json();
                if (response.ok) {
                    showToast(`Synced: ${result.updated} updated, ${result.skipped} skipped`, 'success');
                    updateStatus('ready', 'Synced');
                } else {
                    throw new Error(result.error || 'Sync failed');
                }
            } catch (e) {
                showToast(e.message, 'error');
                updateStatus('error', 'Error');
            } finally {
                setLoading(btnSync, false);
            }
        });
        
        // Start
        init();
    </script>
</body>
</html>
