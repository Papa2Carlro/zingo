<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZINGO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eaeaea; min-width: 320px; }
    .container { padding: 16px; }
    h1 { color: #e94560; font-size: 20px; margin-bottom: 16px; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; font-weight: 600; color: #8892b0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #0f3460; }
    .stat-label { color: #8892b0; font-size: 13px; }
    .stat-value { font-weight: 600; }
    .btn { background: #16213e; border: 1px solid #0f3460; border-radius: 4px; padding: 8px 12px; font-size: 13px; color: #eaeaea; cursor: pointer; width: 100%; transition: all 0.15s; }
    .btn:hover { border-color: #e94560; color: #e94560; }
    .btn.primary { background: #e94560; border-color: #e94560; color: white; }
    .btn.primary:hover { background: #ff6b6b; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    .setting { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #0f3460; }
    .setting label { font-size: 13px; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0f3460; border-radius: 24px; transition: 0.3s; }
    .toggle .slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle input:checked + .slider { background: #e94560; }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
    .select { background: #16213e; border: 1px solid #0f3460; border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #eaeaea; cursor: pointer; }
    .input { background: #16213e; border: 1px solid #0f3460; border-radius: 4px; padding: 8px 10px; font-size: 13px; color: #eaeaea; width: 100%; margin-top: 4px; }
    .input:focus { outline: none; border-color: #e94560; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid #0f3460; padding-bottom: 4px; }
    .tab { padding: 8px 12px; font-size: 12px; color: #8892b0; cursor: pointer; border-radius: 4px 4px 0 0; transition: all 0.15s; }
    .tab.active { color: #e94560; background: rgba(233, 69, 96, 0.1); border-bottom: 2px solid #e94560; }
    .leaderboard { display: flex; flex-direction: column; gap: 8px; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #16213e; border: 1px solid #0f3460; border-radius: 4px; }
    .leaderboard-rank { font-weight: 700; color: #e94560; min-width: 30px; }
    .leaderboard-name { flex: 1; margin: 0 12px; font-size: 13px; }
    .leaderboard-stats { display: flex; gap: 16px; font-size: 11px; color: #8892b0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ZINGO</h1>

    <div class="section">
      <div class="section-title">Гра</div>
      <div class="btn-row">
        <button class="btn primary" id="new-game">Нова гра</button>
        <button class="btn" id="continue-game">Продовжити</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Статистика сесії</div>
      <div class="stat-row"><span class="stat-label">Відмічено</span><span class="stat-value" id="stat-marked">0 / 25</span></div>
      <div class="stat-row"><span class="stat-label">Бінго</span><span class="stat-value" id="stat-bingo">0</span></div>
      <div class="stat-row"><span class="stat-label">Платформа</span><span class="stat-value" id="stat-platform">-</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="stats">Статистика</button>
      <button class="tab" data-tab="leaderboard">Лідерборд</button>
      <button class="tab" data-tab="settings">Налаштування</button>
    </div>

    <div id="panel-stats">
      <div class="section">
        <div class="section-title">Топ фраз</div>
        <div id="top-phrases" style="font-size: 12px; color: #8892b0;">Завантаження...</div>
      </div>
      <div class="section">
        <div class="section-title">Категорії</div>
        <div id="category-stats" style="font-size: 12px; color: #8892b0;">Завантаження...</div>
      </div>
    </div>

    <div id="panel-leaderboard" class="hidden">
      <div class="leaderboard" id="leaderboard-list">
        <div class="leaderboard-item"><span class="leaderboard-rank">1</span><span class="leaderboard-name">Player1</span><span class="leaderboard-stats"><span>🏆 12</span><span>🎮 45</span></span></div>
      </div>
    </div>

    <div id="panel-settings" class="hidden">
      <div class="section">
        <div class="section-title">Інтерфейс</div>
        <div class="setting"><label>Тема</label><select class="select" id="setting-theme"><option value="dark">Темна</option><option value="light">Світла</option></select></div>
        <div class="setting"><label>Мова</label><select class="select" id="setting-lang"><option value="uk">Українська</option><option value="ru">Русский</option><option value="en">English</option></select></div>
        <div class="setting"><label>Позиція</label><select class="select" id="setting-position"><option value="right">Права</option><option value="left">Ліва</option><option value="bottom">Низ</option></select></div>
        <div class="setting"><label>Показувати ваги</label><div class="toggle"><input type="checkbox" id="setting-weights"><span class="slider"></span></div></div>
        <div class="setting"><label>Звуки</label><div class="toggle"><input type="checkbox" id="setting-sounds"><span class="slider"></span></div></div>
      </div>

      <div class="section">
        <div class="section-title">Автовиявлення</div>
        <div class="setting"><label>Розпізнавання мови</label><div class="toggle"><input type="checkbox" id="setting-speech"><span class="slider"></span></div></div>
        <div class="setting"><label>Мова розпізнавання</label><select class="select" id="setting-speech-lang"><option value="ru-RU">Русский</option><option value="uk-UA">Українська</option><option value="en-US">English</option></select></div>
        <div class="setting"><label>Автосканування чату</label><div class="toggle"><input type="checkbox" id="setting-auto-detect"><span class="slider"></span></div></div>
      </div>

      <div class="section">
        <div class="section-title">Зінго режим 🎯</div>
        <div class="setting"><label>Увімкнути зінго-форматування</label><div class="toggle"><input type="checkbox" id="setting-zingo-mode"><span class="slider"></span></div></div>
        <div class="setting"><label>Інтенсивність</label><select class="select" id="setting-zingo-intensity"><option value="light">Light</option><option value="medium">Medium</option><option value="hardcore">Hardcore</option></select></div>
      </div>

      <div class="section">
        <div class="section-title">API</div>
        <div class="setting"><label>Base URL</label><input class="input" id="setting-api-url" placeholder="https://api.example.com"></div>
        <div class="setting"><label>API Key</label><input class="input" id="setting-api-key" placeholder="Optional" type="password"></div>
      </div>

      <div class="section">
        <div class="section-title">Акаунт</div>
        <div class="btn-row">
          <button class="btn primary" id="btn-login">Увійти</button>
          <button class="btn" id="btn-register">Реєстрація</button>
        </div>
        <div id="auth-form" class="hidden" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
          <input class="input" id="auth-nickname" placeholder="Нікнейм">
          <input class="input" id="auth-password" placeholder="Пароль" type="password">
          <input class="input" id="auth-email" placeholder="Email (опціонально)" type="email">
          <div class="btn-row">
            <button class="btn primary" id="auth-submit">OK</button>
            <button class="btn" id="auth-cancel">Скасувати</button>
          </div>
        </div>
        <div id="user-info" class="hidden" style="margin-top: 8px; font-size: 12px; color: #8892b0;"></div>
      </div>

      <div class="section">
        <div class="btn-row">
          <button class="btn" id="btn-export">Експорт</button>
          <button class="btn" id="btn-import">Імпорт</button>
        </div>
        <div class="btn-row" style="margin-top: 8px;">
          <button class="btn" id="btn-sync">Синхронізувати фрази</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
