<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZINGO Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eaeaea; padding: 24px; max-width: 600px; margin: 0 auto; }
    h1 { color: #e94560; font-size: 24px; margin-bottom: 24px; }
    .section { margin-bottom: 24px; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }
    .section-title { font-size: 12px; font-weight: 600; color: #8892b0; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #0f3460; }
    .setting:last-child { border-bottom: none; }
    .setting label { font-size: 14px; }
    .setting-desc { font-size: 11px; color: #8892b0; margin-top: 2px; }
    .toggle { position: relative; width: 52px; height: 28px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0f3460; border-radius: 28px; transition: 0.3s; }
    .toggle .slider:before { content: ''; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    .toggle input:checked + .slider { background: #e94560; }
    .toggle input:checked + .slider:before { transform: translateX(24px); }
    .select { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 4px; padding: 8px 12px; font-size: 13px; color: #eaeaea; cursor: pointer; min-width: 180px; }
    .input { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 4px; padding: 10px 12px; font-size: 13px; color: #eaeaea; width: 100%; max-width: 400px; margin-top: 4px; }
    .input:focus { outline: none; border-color: #e94560; }
    .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .btn { background: #16213e; border: 1px solid #0f3460; border-radius: 4px; padding: 10px 16px; font-size: 13px; color: #eaeaea; cursor: pointer; transition: all 0.15s; }
    .btn:hover { border-color: #e94560; color: #e94560; }
    .btn.primary { background: #e94560; border-color: #e94560; color: white; }
    .btn.primary:hover { background: #ff6b6b; }
    .btn.danger { border-color: #e94560; color: #e94560; }
    .btn.danger:hover { background: rgba(233, 69, 96, 0.1); }
  </style>
</head>
<body>
  <h1>ZINGO Options</h1>

  <div class="section">
    <div class="section-title">Інтерфейс</div>
    <div class="setting">
      <div>
        <label>Тема</label>
        <div class="setting-desc">Кольорова схема інтерфейсу</div>
      </div>
      <select class="select" id="setting-theme">
        <option value="dark">Темна</option>
        <option value="light">Світла</option>
      </select>
    </div>
    <div class="setting">
      <div>
        <label>Мова інтерфейсу</label>
      </div>
      <select class="select" id="setting-lang">
        <option value="uk">Українська</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="setting">
      <div>
        <label>Позиція бінго-картки</label>
      </div>
      <select class="select" id="setting-position">
        <option value="right">Права</option>
        <option value="left">Ліва</option>
        <option value="bottom">Низ</option>
      </select>
    </div>
    <div class="setting">
      <div>
        <label>Показувати ваги фраз</label>
        <div class="setting-desc">Відображати числову вагу в клітинках</div>
      </div>
      <div class="toggle"><input type="checkbox" id="setting-weights"><span class="slider"></span></div>
    </div>
    <div class="setting">
      <div>
        <label>Звукові ефекти</label>
      </div>
      <div class="toggle"><input type="checkbox" id="setting-sounds"><span class="slider"></span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Автовиявлення фраз</div>
    <div class="setting">
      <div>
        <label>Розпізнавання мови (Speech API)</label>
        <div class="setting-desc">Слухати мікрофон/аудіо вкладки для пошуку фраз</div>
      </div>
      <div class="toggle"><input type="checkbox" id="setting-speech"><span class="slider"></span></div>
    </div>
    <div class="setting">
      <div>
        <label>Мова розпізнавання</label>
      </div>
      <select class="select" id="setting-speech-lang">
        <option value="ru-RU">Русский</option>
        <option value="uk-UA">Українська</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <div class="setting">
      <div>
        <label>Автосканування тексту чату</label>
        <div class="setting-desc">Автоматично шукати фрази в DOM чату</div>
      </div>
      <div class="toggle"><input type="checkbox" id="setting-auto-detect"><span class="slider"></span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">API та синхронізація</div>
    <div class="setting">
      <div>
        <label>Base URL API</label>
        <div class="setting-desc">Адреса бекенду для аналітики та лідербордів</div>
      </div>
      <input class="input" id="setting-api-url" placeholder="https://api.example.com">
    </div>
    <div class="setting">
      <div>
        <label>API Key (опціонально)</label>
        <div class="setting-desc">Для вищих лімітів запитів</div>
      </div>
      <input class="input" id="setting-api-key" placeholder="Optional" type="password">
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-sync">Синхронізувати фрази з сервера</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Дані</div>
    <div class="btn-row">
      <button class="btn" id="btn-export">Експорт у JSON</button>
      <button class="btn" id="btn-import">Імпорт з JSON</button>
    </div>
    <div class="btn-row" style="margin-top: 12px;">
      <button class="btn danger" id="btn-reset">Скинути всі дані</button>
    </div>
  </div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
